<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>plgg-flow</title>
  <meta
    name="description"
    content="plgg-flow — plgg-view のための空間ダイアグラム。インタラクション実例集。"
  />
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap"
  />
  <style>
    :root {
      /* the demo is a light sheet, as designed; the tokens
         below already carry dark values, so `light dark`
         here is all it takes to follow the system */
      color-scheme: light;
      --ink: light-dark(#000, #fff);
      --paper: light-dark(#fff, #000);
      --graphite: light-dark(#5c5c5c, #a8a8a8);
      --pencil: light-dark(#a8a8a8, #575757);
      --trace: light-dark(#e4e4e4, #2a2a2a);
      --wash: light-dark(#f4f4f4, #141414);
      --display:
        "Inter", "Noto Sans JP", system-ui,
        sans-serif;
      --body:
        "Inter", "Noto Sans JP", system-ui,
        sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 14px/1.7 var(--body);
      -webkit-font-smoothing: antialiased;
    }
    ::selection {
      background: var(--ink);
      color: var(--paper);
    }
    :focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 2px;
    }
    a {
      color: inherit;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    main {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* ---------- side: wordmark + index ---------- */
    main > aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 0 28px;
      border-right: 1px solid var(--ink);
      display: flex;
      flex-direction: column;
    }
    h1 {
      margin: 0 20px;
      font-family: var(--display);
      font-weight: 600;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    aside > p {
      margin: 18px 20px 4px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--graphite);
    }
    aside > a {
      order: 10;
      margin: auto 20px 0;
      padding-top: 24px;
      font-size: 13px;
    }
    nav {
      display: grid;
      margin-top: 20px;
      border-top: 1px solid var(--ink);
      counter-reset: ex;
    }
    button {
      font: inherit;
      cursor: pointer;
      color: inherit;
    }
    nav button {
      counter-increment: ex;
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: baseline;
      border: 0;
      border-bottom: 1px solid var(--trace);
      background: transparent;
      text-align: left;
      padding: 8px 20px;
      font-size: 14px;
      line-height: 1.45;
    }
    nav button::before {
      content: counter(ex, decimal-leading-zero);
      font: 500 11px var(--display);
      font-variant-numeric: tabular-nums;
      color: var(--pencil);
    }
    nav button:hover {
      background: var(--wash);
    }
    nav button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
      border-bottom-color: var(--ink);
    }
    nav button[aria-pressed="true"]::before {
      color: var(--paper);
    }

    /* ---------- sheet ---------- */
    section {
      padding: 32px clamp(16px, 3.4vw, 56px) 64px;
      min-width: 0;
    }
    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    header {
      justify-content: flex-start;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 20px;
      margin: 0 0 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink);
    }
    h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(20px, 1.8vw, 26px);
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    header .lede {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--graphite);
      max-width: 80ch;
    }
    footer {
      font-size: 13px;
      color: var(--graphite);
    }
    @media (max-width: 760px) {
      main {
        display: block;
      }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--ink);
        padding: 18px 0 0;
      }
      h1 {
        margin: 0 16px;
        font-size: 20px;
      }
      aside > p {
        margin: 12px 16px 0;
      }
      aside > a {
        order: 0;
        margin: 4px 16px 0;
        padding: 0;
      }
      nav {
        display: flex;
        overflow-x: auto;
        margin-top: 14px;
        border-bottom: 0;
      }
      nav button {
        white-space: nowrap;
        border-bottom: 0;
        border-right: 1px solid var(--trace);
        padding: 8px 14px;
      }
      section {
        padding: 22px 16px 48px;
      }
    }

    /* ---------- stage: board + DSL side by side ---------- */
    section {
      display: flex;
      flex-direction: column;
    }
    section > header {
      order: -2;
    }
    @media (min-width: 1001px) {
      main > section {
        height: 100vh;
        overflow: hidden;
        padding-bottom: 20px;
      }
    }
    main > section {
      padding: 14px 16px 10px;
    }
    main > section > header {
      margin-bottom: 10px;
      padding-bottom: 0;
      border-bottom: 0;
    }
    @media (min-width: 1001px) {
      main > section {
        padding-bottom: 8px;
      }
    }
    main > section > header .lede {
      max-width: none;
      flex: 1 1 20ch;
    }
  </style>
  <div id="app"></div>
  <script
    type="module"
    src="./index.js?v=two-finger-orbit"
  ></script>
</html>

<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Flow atlas · plgg-flow</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #eceee6;
      color: #163837;
      font:
        15px "DM Sans",
        system-ui,
        sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    aside {
      background: #173d3b;
      color: #f3f3e8;
      padding: 30px 18px;
    }
    h1,
    h2 {
      font-family: Georgia, serif;
      font-weight: 400;
      letter-spacing: -0.045em;
      margin: 0;
    }
    h1 {
      font-size: 40px;
    }
    aside p {
      margin: 4px 0 24px;
      color: #b3c8be;
    }
    nav {
      display: grid;
      gap: 2px;
    }
    button {
      font: inherit;
      cursor: pointer;
      color: inherit;
    }
    nav button {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 14px;
    }
    nav button:hover,
    nav button[aria-pressed="true"] {
      background: #36615a;
    }
    section {
      padding: clamp(16px, 3vw, 48px);
      min-width: 0;
    }
    header,
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    header {
      justify-content: space-between;
      margin: 16px 0 24px;
    }
    h2 {
      font-size: clamp(32px, 4vw, 66px);
    }
    header span,
    footer {
      font-size: 13px;
      color: #4a6461;
    }
    .toolbar button {
      padding: 7px 13px;
      border: 1px solid #b9c5bb;
      background: #f9faf3;
      border-radius: 6px;
    }
    .toolbar button[aria-pressed="true"] {
      background: #173d3b;
      color: white;
    }
    .flow-board {
      width: 100%;
      height: clamp(340px, 62vh, 730px);
      margin: 14px 0;
      background-color: #f9faf4;
      border: 1px solid #c0cbc1;
      border-radius: 12px;
      touch-action: none;
      user-select: none;
    }
    .flow-board text {
      font: 13px system-ui;
      fill: #173d3b;
    }
    .flow-board g {
      cursor: grab;
    }
    .flow-board circle {
      cursor: crosshair;
    }
    @media (max-width: 720px) {
      main {
        display: block;
      }
      aside {
        padding: 14px;
      }
      h1 {
        font-size: 30px;
      }
      aside p {
        margin: 2px 0 10px;
      }
      nav {
        display: flex;
        overflow-x: auto;
      }
      nav button {
        white-space: nowrap;
      }
      .flow-board {
        height: 50vh;
      }
    }
    .hint {
      line-height: 1.7;
      max-width: 65ch;
    }
    .feature {
      min-height: 50px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .feature button {
      background: #22615a;
      border: 0;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
    }
    .feature button:disabled {
      opacity: 0.4;
    }
    .feature label {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feature input {
      accent-color: #22615a;
    }
    .minimap {
      background: #fff;
      border: 1px solid #9bafa3;
      width: 180px;
      height: 85px;
    }
    .minimap circle {
      cursor: pointer;
    }
    .edge-label {
      paint-order: stroke;
      stroke: #f9faf4;
      stroke-width: 4px;
    }
    .animated {
      stroke-dasharray: 9 6;
      animation: travel 0.8s linear infinite;
    }
    @keyframes travel {
      from {
        stroke-dashoffset: var(--arc, 0px);
      }
      to {
        stroke-dashoffset: calc(
          var(--arc, 0px) - 30px
        );
      }
    }
    .world-grid {
      stroke-width: 0.8;
    }
    .canvas-wrap {
      touch-action: none;
      position: relative;
    }
    .ground-side {
      pointer-events: none;
      position: absolute;
      inset: auto auto 29px 13px;
      background: #f8faf4e8;
      color: #345445;
      border: 1px solid #acbfae;
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 12px;
      pointer-events: none;
    }
    [data-ground-side="below"] + .ground-side {
      background: #fbf1e9;
      color: #654837;
      border-color: #c3a48f;
    }
    h2 {
      font-size: clamp(28px, 3vw, 48px);
    }
    .editing-tools {
      margin-top: 18px;
    }
    .editing-tools summary {
      cursor: pointer;
      font-weight: 600;
    }
    .editing-tools > div {
      display: grid;
      gap: 10px;
      margin-top: 10px;
      max-width: 65ch;
      grid-template-columns: minmax(0, 1fr);
    }
    .editing-tools > div > *,
    .editing-tools label > * {
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }
    .editing-tools table {
      display: block;
      overflow-x: auto;
    }
    .editing-tools input,
    .editing-tools select,
    .editing-tools textarea,
    .editing-tools button {
      font: inherit;
      padding: 6px;
    }
    .editing-tools textarea {
      height: 9em;
      font-family: monospace;
    }
    .editing-tools output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .editing-tools label {
      display: grid;
      gap: 4px;
    }
  </style>
  <div id="app"></div>
  <script type="module" src="./index.js?v=two-finger-orbit"></script>
</html>
